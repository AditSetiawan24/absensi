name: fe_absensi
description: "Aplikasi Absensi Siswa SD Negeri Kemutung Kidul"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # HTTP & API
  http: ^1.2.0
  dio: ^5.4.0
  
  # State Management
  provider: ^6.1.1
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # File Handling
  file_picker: ^6.1.1
  path_provider: ^2.1.2
  open_filex: ^4.3.4
  
  # PDF & Excel
  pdf: ^3.10.7
  printing: ^5.12.0
  excel: ^4.0.3
  
  # Charts
  fl_chart: ^0.66.2
  
  # UI Components
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  
  # Date & Time
  intl: ^0.19.0
  table_calendar: ^3.0.9
  
  # Share
  share_plus: ^7.2.1
  
  # Utils
  url_launcher: ^6.2.4
  image_picker: ^1.0.7
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  
  # Assets will be added when needed
  # assets:
  #   - assets/images/
  #   - assets/icons/
  
  # Using google_fonts package instead of local fonts
